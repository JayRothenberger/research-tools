[project]
name = "research-log-mcp"
version = "0.1.0"
description = "Append-only, searchable, tagged research log served over MCP (SQLite + FTS5)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
research-log-mcp = "research_log_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_log_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
